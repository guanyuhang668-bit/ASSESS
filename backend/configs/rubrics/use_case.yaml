  not_applicable_when: ''
- code: UC1.3
  name: 参与者命名合理性
  parent_code: UC1
  parent_name: 识别参与者 (Actors)
  description: 参与者名称应清晰、稳定、有业务意义，如“学生”“教师”“管理员”；避免“用户1”“操作者”等模糊命名。（注：允许同义词、缩写变体、中英文混用，只要语义明确一致即视为满足要求，不因命名风格差异扣分。）
  error_freq_total: 12
  error_freq_by_class:
    12402班: 3
    12403班: 2
    12404班: 5
    12401班: 1
  weight: 1.0
  scoring_hint: ''
  common_errors: []
  not_applicable_when: ''
- code: UC1.4
  name: 参与者粒度一致性
  parent_code: UC1
  parent_name: 识别参与者 (Actors)
  description: 参与者抽象层次应一致，避免一部分是角色、一部分是具体人员、一部分是组织机构。
  error_freq_total: 11
  error_freq_by_class:
    12401班: 1
    12402班: 5
    12403班: 2
    12404班: 2
  weight: 1.0
  scoring_hint: ''
  common_errors: []
  not_applicable_when: ''
- code: UC1.5
  name: 参与者冗余控制
  parent_code: UC1
  parent_name: 识别参与者 (Actors)
  description: 不应重复表达本质相同的参与者，也不应为同一角色拆出多个无必要 Actor。
