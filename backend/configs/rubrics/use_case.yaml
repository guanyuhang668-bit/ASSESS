- code: UC2.2
  name: 用例目标导向性
  parent_code: UC2
  parent_name: 识别用例（Use Cases）
  description: 用例为参与者提供可独立达成的业务价值（如“查询订单状态”），任何仅描述技术实现步骤（如“点击查询按钮”）或无法独立满足用户目标的行为，都不应作为独立用例。
  error_freq_total: 48
  error_freq_by_class:
    12401班: 4
    12402班: 9
    12403班: 6
    12404班: 4
  weight: 1.0
  scoring_hint: ''
  common_errors: []
  not_applicable_when: ''
- code: UC2.3
  name: 用例命名规范性
  parent_code: UC2
  parent_name: 识别用例（Use Cases）
  description: 用例名称应使用清晰的业务动作短语，如“选课”“提交作业”“查询成绩”；避免“处理数据”“功能1”等空泛表达。（注：允许同义词、缩写变体、中英文混用，只要语义明确一致即视为满足要求，不因命名风格差异扣分。）
  error_freq_total: 8
  error_freq_by_class:
    12401班: 2
    12402班: 2
    12403班: 3
  weight: 1.0
  scoring_hint: ''
  common_errors: []
  not_applicable_when: ''
