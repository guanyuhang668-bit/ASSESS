- code: UC1.2
  name: 参与者外部性正确性
  parent_code: UC1
  parent_name: 识别参与者 (Actors)
  description: Actor 应为系统外部与系统交互的角色，不应把系统内部模块、数据库、控制器等误画为 Actor。
  error_freq_total: 17
  error_freq_by_class:
    12402班: 5
    12404班: 2
