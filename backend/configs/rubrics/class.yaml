  parent_code: CC1
  parent_name: 完整识别类（Classes）
  description: 是否识别出题目中的核心业务概念与领域对象，关键类不得遗漏。（评估时应对照题目需求预先定义核心业务类清单作为评分基准，避免因缺少明确参照导致级联误判——CC1 误判会传播至 CC2/CC3。）
  error_freq_total: 11
