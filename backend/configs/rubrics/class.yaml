  parent_name: 完整识别类（Classes）
  description: 类名应具有明确业务语义，避免模糊、缩写混乱或过技术化命名。（注：允许同义词、缩写变体、中英文混用，只要语义明确一致即视为满足要求，不因命名风格差异扣分。）
  error_freq_total: 4
  error_freq_by_class:
